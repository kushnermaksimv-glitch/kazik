<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Casino Online</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #090314;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .casino-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f, inset 0 0 15px rgba(255, 0, 127, 0.2);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            width: 100%;
            max-width: 380px;
        }

        h1 {
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        /* Экран входа */
        .auth-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        input {
            background: #150a2a;
            border: 1px solid #00f3ff;
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }

        .btn-auth {
            background: #00f3ff;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Игровое окно */
        .game-box {
            display: none;
        }

        .user-info {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .balance-board {
            font-size: 1.4rem;
            margin-bottom: 20px;
            background: #120826;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #00f3ff;
        }

        .balance-board span {
            color: #ffcc00;
            font-weight: bold;
        }

        /* Слоты */
        .slots-container {
            display: flex;
            justify-content: space-between;
            background: #000;
            padding: 10px;
            border-radius: 16px;
            border: 2px solid #ffcc00;
            margin-bottom: 20px;
        }

        .reel {
            width: 30%;
            height: 90px;
            background: #111;
            border-radius: 10px;
            font-size: 3rem;
            line-height: 90px;
            position: relative;
            overflow: hidden;
        }

        .spinning {
            animation: spin 0.1s infinite linear;
        }

        @keyframes spin {
            0% { transform: translateY(-5px); filter: blur(2px); }
            50% { transform: translateY(5px); filter: blur(4px); }
            100% { transform: translateY(-5px); filter: blur(2px); }
        }

        /* Управление */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bet-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
        }

        .bet-btn {
            background: #221548;
            border: 1px solid #00f3ff;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .spin-btn {
            background: linear-gradient(45deg, #ff007f, #ffcc00);
            border: none;
            padding: 16px;
            border-radius: 14px;
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
        }

        .spin-btn:disabled {
            background: #333;
            box-shadow: none;
        }

        .message {
            margin-top: 15px;
            min-height: 20px;
            font-size: 1rem;
            font-weight: bold;
        }

        .win { color: #00ff66; }
        .lose { color: #ff3333; }
    </style>
</head>
<body>

    <div class="casino-card">
        <h1>CASINO 777</h1>

        <!-- Логин -->
        <div class="auth-box" id="auth-box">
            <input type="text" id="username" placeholder="Введите ваш никнейм">
            <button class="btn-auth" id="login-btn">Войти в игру</button>
        </div>

        <!-- Игра -->
        <div class="game-box" id="game-box">
            <div class="user-info">Игрок: <b id="player-display" style="color:#00f3ff"></b></div>
            <div class="balance-board">Баланс: <span id="balance">0</span> $</div>

            <div class="slots-container">
                <div class="reel" id="reel1">🎰</div>
                <div class="reel" id="reel2">🎰</div>
                <div class="reel" id="reel3">🎰</div>
            </div>

            <div class="controls">
                <div class="bet-control">
                    <button class="bet-btn" id="bet-minus">-</button>
                    <span>Ставка: <b id="bet-amount" style="color: #00f3ff;">50</b></span>
                    <button class="bet-btn" id="bet-plus">+</button>
                </div>

                <button class="spin-btn" id="spin-btn">КРУТИТЬ</button>
            </div>

            <div class="message" id="message">Удачи!</div>
        </div>
    </div>

    <!-- Модульное подключение Firebase v9+ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Твоя конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAKXp7pFgT990uxI1FB-d-iIdiSGC1ZvBw",
            authDomain: "kazik-57765.firebaseapp.com",
            databaseURL: "https://kazik-57765-default-rtdb.firebaseio.com",
            projectId: "kazik-57765",
            storageBucket: "kazik-57765.firebasestorage.app",
            messagingSenderId: "488545064083",
            appId: "1:488545064083:web:a2f755e0a3431d2e5f6966",
            measurementId: "G-1FR3X2RRZD"
        };

        // Инициализация
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '7️⃣'];
        let currentUser = "";
        let balance = 1000;
        let currentBet = 50;

        // Элементы UI
        const loginBtn = document.getElementById('login-btn');
        const spinBtn = document.getElementById('spin-btn');
        const betMinus = document.getElementById('bet-minus');
        const betPlus = document.getElementById('bet-plus');

        // Вход в систему
        loginBtn.addEventListener('click', async () => {
            const nameInput = document.getElementById('username').value.trim();
            if (!nameInput) return alert("Введите имя!");

            currentUser = nameInput.toLowerCase().replace(/[^a-z0-9]/g, "");
            document.getElementById('player-display').textContent = nameInput;

            const userRef = ref(database, 'users/' + currentUser);
            
            try {
                const snapshot = await get(userRef);
                if (snapshot.exists()) {
                    balance = snapshot.val().balance;
                } else {
                    balance = 1000; // Старт для новых игроков
                    await set(userRef, { balance: balance });
                }

                document.getElementById('balance').textContent = balance;
                document.getElementById('auth-box').style.display = 'none';
                document.getElementById('game-box').style.display = 'block';
            } catch (error) {
                alert("Ошибка подключения к базе данных! Проверь правила Realtime Database в Firebase.");
                console.error(error);
            }
        });

        // Сохранение баланса
        function updateDbBalance() {
            if (currentUser) {
                update(ref(database, 'users/' + currentUser), { balance: balance });
            }
        }

        // Изменение ставки
        betMinus.addEventListener('click', () => changeBet(-10));
        betPlus.addEventListener('click', () => changeBet(10));

        function changeBet(amount) {
            if (currentBet + amount >= 10 && currentBet + amount <= balance) {
                currentBet += amount;
                document.getElementById('bet-amount').textContent = currentBet;
            }
        }

        // Вращение
        spinBtn.addEventListener('click', () => {
            if (balance < currentBet) {
                const msg = document.getElementById('message');
                msg.textContent = "Недостаточно средств!";
                msg.className = "message lose";
                return;
            }

            balance -= currentBet;
            document.getElementById('balance').textContent = balance;
            updateDbBalance();

            spinBtn.disabled = true;

            const reels = [
                document.getElementById('reel1'),
                document.getElementById('reel2'),
                document.getElementById('reel3')
            ];

            reels.forEach(r => r.classList.add('spinning'));

            setTimeout(() => stopReel(reels[0]), 800);
            setTimeout(() => stopReel(reels[1]), 1200);
            setTimeout(() => stopReel(reels[2]), 1600);

            setTimeout(() => {
                checkWin(reels);
                spinBtn.disabled = false;
            }, 1700);
        });

        function stopReel(reel) {
            reel.classList.remove('spinning');
            reel.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        }

        function checkWin(reels) {
            const r1 = reels[0].textContent;
            const r2 = reels[1].textContent;
            const r3 = reels[2].textContent;
            const msg = document.getElementById('message');

            if (r1 === r2 && r2 === r3) {
                let mult = (r1 === '7️⃣') ? 10 : 5;
                let win = currentBet * mult;
                balance += win;
                msg.textContent = `🎉 ДЖЕКПОТ! +${win}$`;
                msg.className = "message win";
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                let win = currentBet * 2;
                balance += win;
                msg.textContent = `Победа! +${win}$`;
                msg.className = "message win";
            } else {
                msg.textContent = "Попробуй еще раз!";
                msg.className = "message lose";
            }

            document.getElementById('balance').textContent = balance;
            updateDbBalance();
        }
    </script>
</body>
</html>
